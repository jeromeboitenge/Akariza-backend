version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: akariza-db
    restart: always
    environment:
      POSTGRES_USER: akariza_user
      POSTGRES_PASSWORD: akariza_password_2026
      POSTGRES_DB: akariza
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akariza_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akariza-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://akariza_user:akariza_password_2026@postgres:5432/akariza?schema=public"
      JWT_SECRET: "akariza-jwt-secret-key-change-in-production-2026"
      JWT_REFRESH_SECRET: "akariza-refresh-secret-key-change-in-production-2026"
      JWT_EXPIRES_IN: "15m"
      JWT_REFRESH_EXPIRES_IN: "7d"
      PORT: 5000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npx prisma db seed &&
        npm run start:prod
      "

volumes:
  postgres_data:
